<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your money smartly.</p>
        </header>

        <section class="summary">
    <div class="card">
        <h3>Total Expenses</h3>
        <h2 id="total">₹0</h2>
    </div>

    <div class="card">
        <h3>Transactions</h3>
        <h2 id="count">0</h2>
    </div>

    <div class="card">
        <h3>This Month</h3>
        <h2 id="monthly-total">₹0</h2>
    </div>

    <div class="card">
        <h3>Last Month</h3>
        <h2 id="last-month-total">₹0</h2>
    </div>
</section>

        <section class="form-section">
            <h2>Add New Expense</h2>

            <form id="expense-form">
                <input type="text" id="name" placeholder="Expense name" required>
                <input type="number" id="amount" placeholder="Amount (₹)" min="0.01" step="0.01" required>

                <select id="category" required>
                    <option value="">Select Category</option>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Education</option>
                    <option>Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <section class="transactions">
    <h2>Monthly Expense History</h2>

    <select id="month-filter">
        <option value="">Select Month</option>
    </select>

    <div class="action-buttons">
         <button type="button" id="refresh-btn">↻ Refresh</button>

         <button type="button" id="clear-btn" class="clear-btn">
        Clear All Expenses
         </button>
    </div>

    <div class="monthly-summary">
        <h3>Selected Month Total</h3>
        <h2 id="monthly-total">₹0</h2>
    </div>

    <div id="expense-list"></div>
</section>
    </div>

    <script src="script.js"></script>
</body>
</html>
